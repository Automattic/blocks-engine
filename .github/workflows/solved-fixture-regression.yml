name: Solved Site Promotion Gate

on:
  pull_request:
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'

permissions:
  contents: read

jobs:
  solved-site-promotion:
    uses: Automattic/static-site-importer/.github/workflows/solved-site-promotion.yml@2684f1817d7dbe194f5e695016d1a57088c6eb3c
    with:
      static-site-importer-sha: 2684f1817d7dbe194f5e695016d1a57088c6eb3c
      blocks-engine-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      blocks-engine-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

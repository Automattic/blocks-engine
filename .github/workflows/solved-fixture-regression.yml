name: Solved Site Promotion Gate

on:
  pull_request:
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'

permissions:
  contents: read

jobs:
  solved-site-promotion:
    uses: Automattic/static-site-importer/.github/workflows/solved-site-promotion.yml@c761d117cadb31cdbe1755f6d13a2a2a6222ca8e
    with:
      static-site-importer-sha: c761d117cadb31cdbe1755f6d13a2a2a6222ca8e
      blocks-engine-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      blocks-engine-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

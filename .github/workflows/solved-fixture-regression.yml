name: Solved Site Promotion Gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'

permissions:
  contents: read

jobs:
  solved-site-promotion:
    uses: Automattic/static-site-importer/.github/workflows/solved-site-promotion.yml@f174b4bc788234ec370f6f1fb631273c849d3189
    with:
      static-site-importer-sha: f174b4bc788234ec370f6f1fb631273c849d3189
      blocks-engine-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      blocks-engine-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

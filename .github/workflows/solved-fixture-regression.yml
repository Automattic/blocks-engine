name: Solved Site Promotion Gate

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'

permissions:
  contents: read

jobs:
  solved-site-promotion:
    uses: Automattic/static-site-importer/.github/workflows/solved-site-promotion.yml@1adfc40d62fa9454533c43d4de7b3a89f553ab66
    with:
      static-site-importer-sha: 4539063e63f3074366ab5bc50bf9e6ef82055474
      blocks-engine-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      blocks-engine-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

name: Solved Site Promotion Gate

on:
  pull_request:
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/solved-fixture-regression.yml'
      - 'php-transformer/**'
      - 'fixtures/solved/**'

permissions:
  contents: read

jobs:
  solved-site-promotion:
    uses: Automattic/static-site-importer/.github/workflows/solved-site-promotion.yml@25dbc16b77e0915d9e804a59ebeb7b59c2e8688a
    with:
      static-site-importer-sha: 25dbc16b77e0915d9e804a59ebeb7b59c2e8688a
      blocks-engine-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      blocks-engine-repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

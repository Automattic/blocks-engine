name: JS Transformer

on:
  pull_request:
    paths:
      - ".github/workflows/js.yml"
      - "packages/blocks-engine/**"
  push:
    branches:
      - trunk
    paths:
      - ".github/workflows/js.yml"
      - "packages/blocks-engine/**"

jobs:
  validate:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/blocks-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Save-validity tests compile fixtures through the PHP transformer.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Install PHP transformer dependencies
        working-directory: php-transformer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Chromium for SVG asset decode test
        run: pnpm exec playwright install --with-deps chromium

      - name: Run SVG asset decode test
        run: pnpm test:svg-decode

      - name: Run tests
        run: pnpm test

      - name: Run tests (bundle mode — fidelity against dist/wp-runtime.cjs)
        run: pnpm test:bundle

      - name: Assert WP runtime bundle size ceiling (<=30MB)
        run: |
          size=$(du -m dist/wp-runtime.cjs | cut -f1)
          echo "wp-runtime.cjs = ${size}MB"
          test "$size" -le 30

name: Release components

on:
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the release without changing trunk or publishing packages
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: component-release
  cancel-in-progress: false

# Keep these jobs serial. Each Homeboy release may commit version/changelog
# changes and push trunk; the next job must resolve the refreshed trunk tip,
# not the event SHA that started this workflow.
jobs:
  javascript:
    uses: Extra-Chill/homeboy-action/.github/workflows/release.yml@d21c46a3a25b16895c36124a6af481a6f97f8636
    with:
      component: packages/blocks-engine
      action-ref: d21c46a3a25b16895c36124a6af481a6f97f8636
      extension-ref: b94cad68433a34c9129681b1c1a57e63364719db
      prepared-ref: trunk
      dry-run: ${{ inputs.dry-run || false }}
      release-branch: trunk
    secrets: inherit

  php:
    needs: javascript
    if: ${{ always() && (needs.javascript.result == 'success' || needs.javascript.result == 'skipped') }}
    uses: Extra-Chill/homeboy-action/.github/workflows/release.yml@d21c46a3a25b16895c36124a6af481a6f97f8636
    with:
      component: php-transformer
      action-ref: d21c46a3a25b16895c36124a6af481a6f97f8636
      extension-ref: b94cad68433a34c9129681b1c1a57e63364719db
      prepared-ref: trunk
      dry-run: ${{ inputs.dry-run || false }}
      release-branch: trunk
    secrets: inherit

  figma:
    needs: php
    if: ${{ always() && (needs.php.result == 'success' || needs.php.result == 'skipped') }}
    uses: Extra-Chill/homeboy-action/.github/workflows/release.yml@d21c46a3a25b16895c36124a6af481a6f97f8636
    with:
      component: figma-transformer
      action-ref: d21c46a3a25b16895c36124a6af481a6f97f8636
      extension-ref: b94cad68433a34c9129681b1c1a57e63364719db
      prepared-ref: trunk
      dry-run: ${{ inputs.dry-run || false }}
      release-branch: trunk
    secrets: inherit

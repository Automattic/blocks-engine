<!doctype html><html><head><meta charset="utf-8"><title>Linked flex images</title><style>body{margin:0;font-family:sans-serif}</style></head><body>
<main style="max-width:1280px;margin:0 auto;padding:24px">
<h1>Gallery</h1>
<div style="display:flex;flex-wrap:wrap;gap:12px">

<a href="https://example.com/2" style="flex:1 1 180px;min-width:0;display:block"><img src="a.jpg" alt="Two" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block"></a>
<a href="https://example.com/3" style="flex:1 1 180px;min-width:0;display:block"><img src="a.jpg" alt="Three" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block"></a>
</div><p>After the gallery.</p></main></body></html>

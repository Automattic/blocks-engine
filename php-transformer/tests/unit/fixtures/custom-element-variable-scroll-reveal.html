<!DOCTYPE html><html><head><style>
:root { --animation-slide-in: slideIn 0.6s cubic-bezier(0, 0, 0.3, 1) forwards; --animation-fade-in: fadeIn 0.6s cubic-bezier(0, 0, 0.3, 1); }

@media (prefers-reduced-motion: no-preference) {
  .scroll-trigger.animate--slide-in { opacity: 0.01; transform: translateY(2rem); }
  .scroll-trigger:not(.scroll-trigger--offscreen).animate--slide-in { opacity: 1; transform: translateY(0); animation: var(--animation-slide-in); animation-delay: calc(var(--animation-order) * 75ms); }
  .scroll-trigger:not(.scroll-trigger--offscreen).animate--fade-in { animation: var(--animation-fade-in); }
}
@keyframes slideIn { from { transform: translateY(2rem); opacity: 0.01; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0.01; } to { opacity: 1; } }
.grid { display: flex; gap: 1rem; list-style: none; padding: 0; }
</style></head><body><main>
<section><h2>Featured</h2>
<item-slider class="slider-mobile-gutter page-width scroll-trigger animate--slide-in">
  <ul class="grid slider" role="list">
    <li class="grid__item slider__slide"><h3><a href="/items/one">Item one</a></h3><p>$10.00</p></li>
    <li class="grid__item slider__slide"><h3><a href="/items/two">Item two</a></h3><p>$12.00</p></li>
  </ul>
</item-slider></section>
<section><item-details class="item-section">
  <ul class="grid slider" role="list">
    <li class="grid__item slider__slide is-active scroll-trigger animate--fade-in"><img src="/media/one.jpg" alt="Item one photo" width="400" height="400"></li>
  </ul>
  <h1>Item one</h1><p>Description of the item.</p>
</item-details></section>
</main></body></html>

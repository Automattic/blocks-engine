<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editable background heroes</title><style>
body{margin:0}
.hero{min-height:500px;background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url(https://example.com/a.jpg);background-size:cover}
.block{text-align:center}
.flex{display:flex;align-items:center;justify-content:center}
.column{display:flex;flex-direction:column;align-items:center;justify-content:center}
.grid{display:grid;align-items:center;justify-content:center}
.start{display:flex;align-items:flex-start;justify-content:flex-start}
.columns{display:flex;justify-content:space-between}
</style></head><body>
<section class="hero block"><h1>Block title</h1></section>
<section class="hero flex"><h1>Flex title</h1></section>
<section class="hero column"><h1>Column title</h1><p>Second child</p></section>
<section class="hero grid"><h1>Grid title</h1></section>
<section class="hero grid"><h1>Grid title</h1><p>Second child</p></section>
<section class="hero start"><h1>Top left title</h1></section>
<section class="hero columns"><h1>Left column</h1><p>Right column</p></section>
</body></html>

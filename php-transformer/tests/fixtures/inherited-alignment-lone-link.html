<!doctype html>
<html><head><meta charset="utf-8"><title>Centered link</title>
<style>
.btn { display: inline-block; }
.cta { display: inline-block; padding: 15px 32px; background-color: #E1E4E6; color: #000; }
</style></head>
<body>
<div style="text-align:center"><a class="btn" href="https://example.com/register">register for the event</a></div>
<div style="text-align:center"><a class="cta" href="https://example.com/tickets">buy tickets</a></div>
<div style="text-align:right"><a href="https://example.com/schedule">see the schedule</a></div>
<div style="text-align:right"><a class="cta" href="https://example.com/venue">find the venue</a></div>
</body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Font stacks</title>
<style>
html, body { margin: 0px; background: rgb(0, 0, 0); }
.team { background: rgb(250, 247, 242); color: rgb(43, 38, 34); text-align: center; padding: 90px 6vw 100px; font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
.team h2 { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-weight: 500; font-size: 44px; margin: 0px 0px 12px; color: rgb(31, 42, 58); }
.card h3 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 28px; font-weight: 600; margin: 24px 0px 6px; color: rgb(31, 42, 58); }
.contact { background: rgb(31, 42, 58); color: rgb(250, 247, 242); text-align: center; padding: 80px 6vw 90px; font-family: Montserrat, "Helvetica Neue", Arial, sans-serif; }
.contact h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: 44px; margin: 0px 0px 12px; }
.contact a { display: block; color: rgb(250, 247, 242); text-decoration: none; font-size: 17px; letter-spacing: 0.08em; margin: 10px 0px; }
</style></head><body>
<section class="team"><h2>Our Team</h2><div class="card"><h3>Name</h3></div></section><section class="contact"><h2>Contact</h2><a href="mailto:a@example.com">a@example.com</a><a href="tel:+15550100">555-0100</a></section>
</body></html>

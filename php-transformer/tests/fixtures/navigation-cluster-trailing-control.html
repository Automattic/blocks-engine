<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Navigation with a trailing control</title>
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.navbar{display:flex}
.c-header .navbar-brand img{width:200px;height:36px}
.collapse:not(.show){display:none}
.navbar-nav{display:flex;flex-direction:column;list-style:none;padding-left:0;margin:0}
@media(min-width:992px){.navbar-expand-lg .navbar-collapse{display:flex!important;flex-basis:auto}.navbar-expand-lg .navbar-nav{flex-direction:row}}
</style></head>
<body><header class="c-header">
<nav class="navbar navbar-expand-lg">
  <a class="navbar-brand" href="/"><span class="sr-only">Brand</span><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 36'%3E%3Crect width='200' height='36' fill='navy'/%3E%3C/svg%3E" alt=""></a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav"><li><a href="/a/">About</a></li><li><a href="/b/">News</a></li><li><a href="/c/">Contact</a></li></ul>
    <button class="btn" type="button">Donate</button>
  </div>
</nav>
</header></body></html>

<!doctype html>
<html><head><style>
button { border: 1px solid #17191c; background: transparent; }
.rounded { border-radius: 8px; }
.corners { border-top-left-radius: 12px; border-top-right-radius: 4px; border-bottom-right-radius: 6px; border-bottom-left-radius: 2px; }
</style></head><body><main>
<button type="button">Square</button>
<button type="button" class="rounded">Rounded</button>
<button type="button" class="corners">Corners</button>
</main></body></html>

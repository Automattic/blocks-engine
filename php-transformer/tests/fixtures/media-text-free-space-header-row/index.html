<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Header row</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .bar { background: #123; color: #fff; padding: 18px 0; }
  .bar-inner { max-width: 1240px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; }
  .logo-link { display: inline-flex; }
  .logo { width: 170px; height: auto; display: block; }
  .cta { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <a class="logo-link" href="/index.html"><img class="logo" src="logo.svg" alt="Brand"></a>
    <button class="cta">Join the list</button>
  </div>
</header>
<main><h1>Header row</h1><p>Body copy.</p></main>
</body>
</html>

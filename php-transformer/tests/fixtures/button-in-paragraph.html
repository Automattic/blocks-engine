<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Button in paragraph</title>
<style>
.btn{display:inline-block;padding:8px 24px;border-radius:6px;font-weight:600;border:none;cursor:pointer;text-decoration:none}
.btn--primary{background:#b9276b;color:#fff}
.text-center{text-align:center}
</style></head><body><main>
<p>Fill in the form below.</p>
<p class="text-center"><button type="button" class="btn btn--primary">Show the form</button></p>
</main></body></html>

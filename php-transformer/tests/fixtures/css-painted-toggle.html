<html><head><style>
body { margin: 0; }
header { display: flex; justify-content: flex-end; padding: 12px; }
.menu-toggle { display: none; width: 44px; height: 40px; border: 0; background: transparent; align-items: center; justify-content: center; }

</style></head><body>

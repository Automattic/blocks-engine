<!doctype html>
<html>
<head>
<style>
body{margin:0}
.band{position:relative;min-height:480px;padding:40px}
.divider-layer{position:absolute;left:0;right:0;bottom:0;height:400px;pointer-events:none}
.divider-layer svg{position:absolute;left:0;bottom:0;width:100%;height:77.5%}
.closing{min-height:200px}
</style>
</head>
<body>
<main>
<section class="band"><h2>Opening band</h2><p>Copy above a stretched divider.</p><div class="divider-layer"><svg class="divider-stroke" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0.4 L0.5 1 L1 0.4" fill="none" stroke="#123456" vector-effect="non-scaling-stroke"/></svg></div></section>
<section class="closing"><p>Closing band.</p></section>
</main>
<footer><p>Footer</p></footer>
</body>
</html>

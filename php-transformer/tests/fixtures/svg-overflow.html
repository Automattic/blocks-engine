<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SVG overflow</title>
<style>
body{margin:40px;font-family:sans-serif}
.btn{position:relative;width:200px;height:40px}
.bg{position:absolute;inset:0}
.bg svg{display:block;width:100%;height:100%;overflow:visible}
.label{position:relative;margin:0;line-height:40px;text-align:center;color:#fff}
</style></head>
<body>
<div class="btn">
<div class="bg"><svg><path d="M0,-12H200C220,-12 232,4 232,20C232,36 220,52 200,52H0C-20,52 -32,36 -32,20C-32,4 -20,-12 0,-12Z" fill="#ec1c2a"/></svg></div>
<p class="label">Get in touch</p>
</div>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cards</title><style>
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1140px;margin:0 auto}
.tcard{position:relative;border-radius:12px;overflow:hidden;min-height:260px;display:flex;align-items:flex-end;color:#fff;isolation:isolate}
.tcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.tcard .t{padding:22px}
.tcard .tag{position:absolute;top:14px;left:14px;z-index:1;background:#e2622a;color:#fff;font-size:.68rem;font-weight:600;padding:5px 11px;border-radius:40px;text-transform:uppercase}
</style></head><body><main><div class="tgrid">
<a class="tcard" href="/a.html"><span class="tag">Warehousing</span><img src="photo.jpg" alt="Warehouse"><div class="t"><h3>Warehouses</h3><p>Clear-span layouts built to perform long-term.</p></div></a>
<a class="tcard" href="/b.html"><span class="tag">Retail</span><img src="photo.jpg" alt="Retail"><div class="t"><h3>Retail Centers</h3><p>Flexible multi-tenant layouts.</p></div></a>
</div></main></body></html>

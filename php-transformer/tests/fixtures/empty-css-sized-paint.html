<!doctype html><html><head><title>Chips</title><style>
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.swatch{text-align:center}
.swatch .chip{display:block;width:100%;aspect-ratio:3/2;border-radius:8px;border:1px solid rgba(0,0,0,.2)}
.swatch .sname{display:block;margin-top:7px;font-size:.8rem}
</style></head><body><main>
<div class="swatches"><div class="swatch"><span class="chip" style="background:#C9B79C"></span><span class="sname">Sand</span></div><div class="swatch"><span class="chip" style="background:#4A3B2A"></span><span class="sname">Brown</span></div><div class="swatch"><span class="chip" style="background:#A9792B"></span><span class="sname">Gold</span></div></div>
</main></body></html>

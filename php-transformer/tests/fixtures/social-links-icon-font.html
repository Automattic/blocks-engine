<style>
.jw-element-content{display:flex;gap:7.5px}
.jw-element-social-follow-profile{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:39px;height:39px;padding:7.5px;text-decoration:none;color:#222;--jw-button-icon-size:18.75px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.jw-btn-icon[class*=website-rendering-icon]{display:flex;font-size:var(--jw-button-icon-size);width:19px;height:19px;line-height:19px}
[class*=website-rendering-icon]:before{font-family:Arial;font-style:normal;font-weight:normal}
.website-rendering-icon-facebook:before{content:"f"}
.website-rendering-icon-instagram:before{content:"◎"}
.website-rendering-icon-whatsapp:before{content:"☎"}
@media(max-width:600px){.jw-element-social-follow-profile{--jw-button-icon-size:18.75px}}
</style>
<div class="jw-element-social-follow"><span class="jw-element-content">
<a href="https://facebook.com/example" class="jw-element-social-follow-profile"><span class="sr-only">Facebook</span><i aria-hidden="true" class="jw-btn-icon website-rendering-icon-facebook"></i></a>
<a href="https://instagram.com/example" class="jw-element-social-follow-profile"><span class="sr-only">Instagram</span><i aria-hidden="true" class="jw-btn-icon website-rendering-icon-instagram"></i></a>
<a href="https://whatsapp.com/example" class="jw-element-social-follow-profile"><span class="sr-only">WhatsApp</span><i aria-hidden="true" class="jw-btn-icon website-rendering-icon-whatsapp"></i></a>
</span></div>

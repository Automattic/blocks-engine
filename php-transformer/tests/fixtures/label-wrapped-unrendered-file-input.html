<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Upload</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff;color:#1e293b}
.wrap{max-width:560px;margin:40px auto}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:16px;border:1px solid #fde68a;border-radius:12px;cursor:pointer}
.t{font-size:14px}
.s{font-size:11px;color:#64748b;margin-top:2px}
.hidden{display:none}
</style></head><body>
<div class="wrap"><h1>Send your files</h1><p>Attach the material for your request.</p>
<label class="drop"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 13v8"></path><path d="m8 17 4-4 4 4"></path></svg><span class="t">Click to choose your files</span><span class="s">Files are listed with your request</span><input type="file" multiple class="hidden" accept=".pdf,.doc" data-blocks-engine-capture-native-control-state="{&quot;version&quot;:1,&quot;kind&quot;:&quot;file&quot;,&quot;rendered&quot;:false}"></label>
</div>
</body></html>

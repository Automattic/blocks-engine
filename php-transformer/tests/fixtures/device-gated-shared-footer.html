<title>Home</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#222}
.site-header{padding:16px 0;border-bottom:1px solid #ddd}
.site-header nav{max-width:980px;margin:0 auto}
.site-header a{margin-right:16px;color:#222}
.page-content{max-width:980px;margin:0 auto;padding:40px 0}
.site-footer{border-top:1px solid #ddd}
</style>
<style data-blocks-engine-capture-device-style="desktop tablet" data-blocks-engine-capture-source-media="all" media="not all">
:where([data-blocks-engine-capture-device-document="desktop"]) .footer-grid{display:grid;grid-template-columns:100%;grid-template-rows:auto auto}

:where([data-blocks-engine-capture-device-document="desktop"]) .site-footer{--footer-note-font:normal normal normal 15px/1.4em Georgia,"Times New Roman",serif}
:where([data-blocks-engine-capture-device-document="desktop"]) .footer-note-text{font:var(--footer-note-font);margin:0}
:where([data-blocks-engine-capture-device-document="desktop"]) .footer-links{position:relative;left:34px;margin:0 0 28px calc(50% - 490px);grid-area:2/1/3/2;justify-self:start;display:flex;gap:8px;list-style:none;padding:0}
:where([data-blocks-engine-capture-device-document="desktop"]) .footer-links a{display:block;width:20px;height:20px;border-radius:50%;background:#222}
</style>
<style data-blocks-engine-capture-device-style="mobile" data-blocks-engine-capture-source-media="all" media="not all">

:where([data-blocks-engine-capture-device-document="mobile"]) .footer-links{position:relative;left:20px;margin:0 0 28px 0px;grid-area:2/1/3/2;justify-self:start;display:flex;gap:8px;list-style:none;padding:0}
:where([data-blocks-engine-capture-device-document="mobile"]) .footer-links a{display:block;width:20px;height:20px;border-radius:50%;background:#222}
</style>
</head>

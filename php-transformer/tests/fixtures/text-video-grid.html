<!doctype html><html><head><title>Split</title><style>
body{margin:0}.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.split .wrap{display:grid;grid-template-columns:1fr 1.25fr;gap:44px;align-items:center}
.split .frame{aspect-ratio:16/9;background:#000}.split video{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:860px){.split .wrap{grid-template-columns:1fr;gap:28px}}
</style></head><body><main><section class="split"><div class="wrap">
<div class="head"><h2>Watch the build</h2><p>From raw steel to a finished structure, this is the kind of building we design.</p></div>
<div class="frame"><video src="clip.mp4" poster="poster.jpg" controls muted loop playsinline preload="metadata"></video></div>
</div></section></main></body></html>

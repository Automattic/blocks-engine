<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Caption margin</title>
<style>
body{margin:0;font-family:sans-serif;background:#f3f4f7}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:760px;margin:40px auto}
.card{margin:0;background:#fff;border-radius:6px;overflow:hidden}
.card img{display:block;width:100%;height:180px;object-fit:cover}
.card figcaption{padding:11px 13px;font-size:13.44px;text-transform:uppercase}
.ggrid{position:relative;margin:0}
.ggrid figcaption{position:absolute;left:0;right:0;bottom:0;padding:10px;background:rgba(0,0,0,.6);color:#fff}
</style></head><body><main>
<div class="cards">
<figure class="card"><img src="https://picsum.photos/id/10/600/400" alt="One"><figcaption>Commercial steel</figcaption></figure>
<figure class="card"><img src="https://picsum.photos/id/11/600/400" alt="Two"><figcaption>Heavy-duty doors</figcaption></figure>
<figure class="ggrid"><img src="https://picsum.photos/id/12/600/400" alt="Three"><figcaption>Overlay caption</figcaption></figure>
</div></main></body></html>

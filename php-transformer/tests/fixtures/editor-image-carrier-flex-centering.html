<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Icon notice</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  main { max-width: 640px; margin: 40px auto; padding: 0 20px; }
  .notice { display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px; border: 1px solid #ccc; border-radius: 14px; }
  .notice-icon { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: #e4eee0; color: #264; display: flex; align-items: center; justify-content: center; }
  .notice-icon svg { width: 18px; height: 18px; }
  @media (max-width: 600px) { .notice-text { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Icon notice</h1>
  <div class="notice">
    <div class="notice-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    </div>
    <div class="notice-text"><strong>Heads up</strong> A short notice body.</div>
  </div>
</main>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reduced: repeated card grid</title>
<style>
body{margin:0;font-family:system-ui,sans-serif}
.grid{display:grid;row-gap:2em;column-gap:1.25em;grid-template-columns:repeat(18,minmax(0,1fr))}
.cells{display:contents}
.cell{display:flex;height:100%;position:relative;grid-column:span 6}
.card{position:relative;flex:1 1 0%;min-width:0;gap:1em;display:flex;flex-direction:column;align-items:flex-start}
.thumb{width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:8px}
.thumb-inner{position:relative;height:100%}
.thumb-bg{display:flex;position:relative;width:100%;height:100%;background-size:cover;background-repeat:no-repeat;background-position:40% 60%}
.body h4{margin:0} .body p{margin:0} .small{font-size:.875em}
</style></head>
<body><div class="shell-0"><div data-node-view-wrapper="" style="white-space:normal"><div data-node-view-content="" style="white-space:pre-wrap"><div class="shell-3"><div data-node-view-wrapper="" style="white-space:normal"><div data-node-view-content="" style="white-space:pre-wrap"><div class="shell-6"><div data-node-view-wrapper="" style="white-space:normal"><div data-node-view-content="" style="white-space:pre-wrap"><div class="shell-9"><div data-node-view-wrapper="" style="white-space:normal"><div data-node-view-content="" style="white-space:pre-wrap"><div class="shell-12"><div data-node-view-wrapper="" style="white-space:normal">
<h2>Fleet</h2>
<div class="grid"><div class="cells">

<div class="cell"><div class="card"><div class="thumb"><div class="thumb-inner"><div class="thumb-bg" style="background-image:url('b.jpg')"></div></div></div><div class="body"><h4>Beta</h4><p>SN 12</p><p class="small">Owner 2</p></div></div></div>
<div class="cell"><div class="card"><div class="thumb"><div class="thumb-inner"><div class="thumb-bg" style="background-image:url('c.jpg')"></div></div></div><div class="body"><h4>Gamma</h4><p>SN 13</p><p class="small">Owner 3</p></div></div></div>

</div></div>
</div></div></div></div></div></div></div></div></div></div></div></div></div></div></body></html>

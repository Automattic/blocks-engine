<ambient-frame id="ambient" class="media-frame" data-playback-info="{&quot;rate&quot;:1}" style="display:block;position:relative;width:320px;height:180px;overflow:hidden">
  <video id="native-clip" class="native-clip" src="clip.webm" autoplay muted loop playsinline preload="auto" style="display:block;width:100%;height:100%;object-fit:cover;object-position:center center;opacity:1"></video>
  <cover-frame id="cover" class="media-cover" data-image-info="{&quot;width&quot;:640}" style="display:block;width:100%;height:100%;opacity:0">
    <img src="cover.svg" alt="" width="640" height="360" style="display:block;width:100%;height:100%;object-fit:cover">
  </cover-frame>
</ambient-frame>

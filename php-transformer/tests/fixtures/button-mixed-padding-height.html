<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mixed Button Height</title>
<style>*,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}body{margin:0;font-family:sans-serif;background:#1d4ed8;color:#fff}button{font:inherit;background:transparent;cursor:pointer}.wrap{padding:32px}.row{display:flex;flex-wrap:wrap;gap:16px;margin-top:32px}.btn{display:inline-flex;align-items:center;border-radius:6px;background:#fff;color:#1d4ed8}.h-9{height:2.25rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}.py-6{padding-top:1.5rem;padding-bottom:1.5rem}.px-4{padding-left:1rem;padding-right:1rem}.trust{margin-top:32px;display:flex;gap:24px;font-size:.875rem}</style></head>
<body><header class="wrap"><a href="#quote"><button class="btn h-9 px-4 py-2">Get a quote</button></a></header><div class="wrap"><h1>Short heading</h1><div class="row"><a href="#quote"><button class="btn h-9 px-4 py-6">Request a quote</button></a><a href="tel:555"><button class="btn h-9 px-4 py-6">Call us</button></a></div><div class="trust"><span>Fast turnaround</span><span>Ongoing support</span></div></div></body></html>

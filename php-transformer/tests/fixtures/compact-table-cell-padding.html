<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Compact table</title>
<style>
td{padding:8px 16px;border-bottom:1px solid #ddd}
.table--compact td{padding:4px 16px}
</style></head><body><main>
<h2>Hours</h2>
<table class="table--compact"><tbody>
<tr><td>Monday</td><td>10 – 20</td></tr><tr><td>Tuesday</td><td>15 – 21</td></tr><tr><td>Wednesday</td><td>10 – 17</td></tr>
</tbody></table>
</main></body></html>

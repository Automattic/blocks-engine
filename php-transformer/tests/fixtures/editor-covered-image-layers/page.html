<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Layered photo card</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; }
  main { max-width: 640px; margin: 40px auto; padding: 0 20px; }
  .visual { position: relative; aspect-ratio: 5/4; border-radius: 24px; overflow: hidden; background: #ddd; }
  .visual-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .visual-tint { position: absolute; inset: 0; background: rgba(0,0,0,.15); }
  .device { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 40%; aspect-ratio: 9/16; background: #fff; border: 8px solid #111; border-radius: 28px; }
  .badge { position: absolute; top: 8%; left: 4%; background: #fff; padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Layered photo card</h1>
  <div class="visual">
    <img class="visual-img" src="https://example.com/photo.png" alt="Gradient photo">
    <div class="visual-tint"></div>
    <div class="device"><p>Screen</p></div>
    <div class="badge">Floating badge</div>
  </div>
</main>
</body>
</html>

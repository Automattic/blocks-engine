<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Native emoji typography</title>
<style>
html,body{margin:0;padding:0}
.emoji-fixture{width:calc(100vw - 32px);max-width:600px;margin:16px}
.emoji-copy{font-family:Arial,sans-serif;font-size:18px;line-height:22px;margin:0}
.emoji-inline{line-height:normal}
.emoji-following{font-family:Arial,sans-serif;font-size:18px;line-height:22px;margin:0;padding-top:16px}
@media(min-width:700px){.emoji-copy{font-size:24px;line-height:28px}}
@media(min-width:1200px){.emoji-copy{font-size:30px;line-height:34px}}
</style></head><body><main class="emoji-fixture"><p class="emoji-copy"><span class="emoji-inline">Native emoji 👉🏼</span><br>Keep this text editable.<br>Authored line height.</p><p class="emoji-following">Following text 🧑🏽‍🍳 stays in its authored position.</p></main></body></html>
